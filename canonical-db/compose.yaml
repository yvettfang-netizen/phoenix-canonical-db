name: phoenix-canonical-foundation
services:
  pg16:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: phoenix_canonical_dev
      POSTGRES_USER: phoenix_bootstrap
      POSTGRES_PASSWORD: ${PHOENIX_DB_BOOTSTRAP_PASSWORD:?Set a local test password in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_bootstrap -d phoenix_canonical_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [canonical_test]
  pg17:
    profiles: [compat]
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_DB: phoenix_canonical_dev
      POSTGRES_USER: phoenix_bootstrap
      POSTGRES_PASSWORD: ${PHOENIX_DB_BOOTSTRAP_PASSWORD:?Set a local test password in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_bootstrap -d phoenix_canonical_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [canonical_test]
networks:
  canonical_test:
    internal: true
volumes:
  pg16_data:
  pg17_data:
