name: phoenix-canonical-foundation
services:
  pg16:
    image: postgres:16
    environment:
      POSTGRES_DB: phoenix_canonical_dev
      POSTGRES_USER: phoenix_bootstrap
      POSTGRES_PASSWORD: ${PHOENIX_DB_BOOTSTRAP_PASSWORD:?Set a local test password in .env}
    volumes:
      - pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_bootstrap -d phoenix_canonical_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [canonical_test]
  pg17:
    profiles: [compat]
    image: postgres:17
    environment:
      POSTGRES_DB: phoenix_canonical_dev
      POSTGRES_USER: phoenix_bootstrap
      POSTGRES_PASSWORD: ${PHOENIX_DB_BOOTSTRAP_PASSWORD:?Set a local test password in .env}
    volumes:
      - pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_bootstrap -d phoenix_canonical_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [canonical_test]
networks:
  canonical_test:
    internal: true
volumes:
  pg16_data:
  pg17_data:
